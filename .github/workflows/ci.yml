name: CI

on:
  push:
    branches: [main, overhaul]
  pull_request:

jobs:
  backend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --extra all --extra cpu
      - run: uv run pytest -q
      - run: uv run pytest -m acceptance tests/acceptance -q
      - run: uv run ruff check backend tests eval scripts
      - run: uv run pytest -m "hardening and not slow" tests/hardening -q

  backend-postgres:
    # Postgres differs from SQLite (32-bit INTEGER, no NUL in text, no round(float,int), psycopg 3):
    # run the hardening suite against a real server with a fresh schema per app.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: pw
          POSTGRES_DB: rc
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    env:
      REQCLUSTER_TEST_DATABASE_URL: postgresql://postgres:pw@127.0.0.1:5432/rc
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --extra all --extra cpu
      - run: uv run pytest -m "hardening and not slow" tests/hardening -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint
