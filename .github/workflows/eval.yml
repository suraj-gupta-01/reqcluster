name: Evaluation Harness

on:
  push:
    branches: [main, overhaul]
  pull_request:

jobs:
  eval-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hf-all-minilm-v1

      - run: uv sync --extra all --extra cpu

      - name: Run Harness Self-Tests
        run: uv run pytest tests/eval -q

      - name: Run Evaluation Harness (Fast Suite)
        # baselines were produced on CPU
        env:
          REQCLUSTER_EMBEDDING_DEVICE: cpu
        run: uv run python -m eval run --suite fast --model real

      - name: Upload Evaluation Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: eval/results/
