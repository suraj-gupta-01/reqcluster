# Default: backend (SQLite in the reqcluster_var volume) + frontend.
# Postgres: export DATABASE_URL=postgresql://reqcluster:reqcluster_dev_password@postgres:5432/reqcluster
#           docker compose --profile full up
services:
  postgres:
    profiles: ["full"]
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: reqcluster
      POSTGRES_USER: reqcluster
      POSTGRES_PASSWORD: reqcluster_dev_password   # change in production
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reqcluster -d reqcluster"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    volumes:
      - reqcluster_var:/app/var
    environment:
      - CORS_ORIGINS=http://localhost:3000
      - DATABASE_URL   # passed through only if set in the host shell
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  reqcluster_var:
