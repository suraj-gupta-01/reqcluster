[project]
name = "reqcluster"
version = "0.2.0"
description = "Requirement clustering, dependency analysis and LLM refinement for systems engineering"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.18",
    "pydantic>=2.9",
    "sqlalchemy>=2.0.36",
    "numpy>=2.0",
    "openpyxl>=3.1.5",
    "scikit-learn>=1.5",          # also provides HDBSCAN (sklearn.cluster)
    "umap-learn>=0.5.7",
    "sentence-transformers>=3.3",
    "reportlab>=4.2",             # PDF export (imported at module load)
]

[project.scripts]
reqcluster-api = "reqcluster.app:main"

[project.optional-dependencies]
# Each extra is lazily imported with a fallback, so the app runs without it.
fast = ["hnswlib>=0.8.0"]                 # ANN similarity graph; falls back to exact kNN
nlp = ["spacy>=3.8"]                      # dependency-parse artifacts; falls back to regex
charts = ["matplotlib>=3.9"]              # charts inside the PDF report
postgres = ["psycopg2-binary>=2.9.10"]    # DATABASE_URL=postgresql://...
eval = ["pyyaml>=6.0", "pandas>=2.2.3"]
# Pick exactly one torch build (same on Windows and Linux):
#   uv sync --extra cpu      or      uv sync --extra gpu   (CUDA 12.6, NVIDIA driver >= 560)
cpu = ["torch>=2.4"]
gpu = ["torch>=2.4"]
all = ["reqcluster[fast,nlp,charts,postgres,eval]"]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-cov>=6.0", "ruff>=0.8", "pyyaml>=6.0"]

[tool.uv]
default-groups = ["dev"]
conflicts = [[{ extra = "cpu" }, { extra = "gpu" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "gpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["acceptance: black-box contract tests for the redesign"]
addopts = "-m 'not acceptance' --import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["frontend", "docs/pitch"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM"]
ignore = ["E501"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/reqcluster"]
