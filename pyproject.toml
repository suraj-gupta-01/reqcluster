[project]
name = "reqcluster"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10.11"
dependencies = [
    "fastapi==0.111.0",
    "hdbscan==0.8.38.post1",
    "numpy==1.26.4",
    "openpyxl==3.1.2",
    "pandas==2.2.2",
    "pydantic==2.7.1",
    "pytest>=9.0.3",
    "python-multipart==0.0.9",
    "scikit-learn==1.5.0",
    "sentence-transformers==3.0.1",
    "sqlalchemy==2.0.30",
    "umap-learn==0.5.6",
    "uvicorn[standard]==0.30.1",
    # PostgreSQL driver (bottleneck #1)
    "psycopg2-binary>=2.9.9",
    # Redis client for embedding cache (bottleneck #3)
    "redis>=5.0.0",
    # PDF clustering-report export (with charts)
    "reportlab>=4.0.0",
    "matplotlib>=3.7.0",
    # Approximate-kNN similarity graph (O(N log N) instead of O(N^2))
    "hnswlib>=0.8.0",
    # NLP: spaCy for dependency-parse-based artifact extraction (DP5 hardening).
    # The en_core_web_sm model (~13 MB) is a separate one-time download:
    #     python -m spacy download en_core_web_sm
    # It is not a PyPI package, so it cannot be pinned here. Without it the
    # extractor falls back to its regex path rather than failing.
    "spacy>=3.7.0",
]
