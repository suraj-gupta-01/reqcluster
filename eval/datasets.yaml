datasets:
  bit_control:
    path: data/bit_control_requirements.csv
    suite: fast
    ground_truth: module
    tolerances:
      # Floors set after first run — update once baseline JSON is committed
      ari:
        floor: 0.05
        delta: -0.10
      noise_pct:
        floor: 60.0
        delta: 10.0
        lower_is_better: true
      hungarian_accuracy_pct:
        floor: 20.0
        delta: -5.0
      parse_success_rate:
        floor: 0.90
        delta: -0.05

  aerospace:
    path: data/aerospace_requirements.csv
    suite: fast
    ground_truth: module
    tolerances:
      accuracy_pct:
        floor: 55.0
        delta: -3.0
      reference_recall:
        floor: 0.60
        delta: -0.15
      merge_precision:
        floor: 0.40
        delta: -0.20
      parse_success_rate:
        floor: 0.90
        delta: -0.05

  uav_fms_2k:
    path: data/uav_fms_2k_requirements.csv
    suite: fast
    ground_truth: module
    tolerances:
      accuracy_pct:
        floor: 95.0
        delta: -1.5
      noise_pct:
        floor: 10.0
        delta: 2.0
        lower_is_better: true
      ari:
        floor: 0.90
        delta: -0.05
      v_measure:
        floor: 0.90
        delta: -0.05
      parse_success_rate:
        floor: 0.90
        delta: -0.05

  promise:
    path: data/promise_requirements.csv
    suite: fast
    ground_truth: module
    tolerances:
      parse_success_rate:
        floor: 0.90
        delta: -0.05

  uav_fms_10k:
    path: data/uav_fms_10k_requirements.csv
    suite: stress
    ground_truth: module
    tolerances:
      ari:
        floor: 0.89
        delta: -0.05
      accuracy_pct:
        floor: 94.0
        delta: -2.0
      noise_pct:
        floor: 12.0
        delta: 3.0
        lower_is_better: true

  uav_fms_35k:
    path: data/uav_fms_35k_requirements.csv
    suite: stress
    ground_truth: module
    tolerances:
      accuracy_pct:
        floor: 90.0
        delta: -3.0
      noise_pct:
        floor: 15.0
        delta: 4.0
        lower_is_better: true

  multidomain:
    path: data/multidomain_requirements.csv
    suite: fast
    ground_truth: module
    tolerances:
      ari:
        floor: 0.62
        delta: -0.10
      parse_success_rate:
        floor: 0.90
        delta: -0.05

  dependency_gold:
    path: data/dependency_gold_requirements.csv
    suite: fast
    ground_truth: module
    tolerances:
      reference_recall:
        floor: 0.30
        delta: -0.15
      parse_success_rate:
        floor: 0.90
        delta: -0.05

  adversarial:
    path: data/adversarial_requirements.csv
    suite: stress
    ground_truth: module
    tolerances:
      ari:
        floor: 0.32
        delta: -0.10
      parse_success_rate:
        floor: 0.80
        delta: -0.05
